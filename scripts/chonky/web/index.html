<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/chonky/">
<title>Chonky — image pipeline</title>
<style>
  :root {
    --bg:#14161a; --panel:#1c1f26; --line:#2b303a; --ink:#e8eaee;
    --muted:#9aa3b2; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#4c8dff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600}
  .geo{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  main{padding:22px;max-width:1500px}
  textarea{width:100%;height:150px;background:#0f1115;color:var(--ink);
           border:1px solid var(--line);border-radius:8px;padding:12px;
           font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
  button{background:var(--accent);color:#fff;border:0;border-radius:7px;
         padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer}
  button.ghost{background:#2a2f3a}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin:18px 0}
  .card h2{font-size:14px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  .imgs{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .pane{position:relative}
  .pane .cap{color:var(--muted);font-size:11px;margin-bottom:6px;
             text-transform:uppercase;letter-spacing:.06em}
  .pane img{display:block;border:1px solid var(--line);border-radius:8px;max-width:100%}
  .stage{position:relative;display:inline-block;cursor:crosshair}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .b{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
     background:#262b35;color:var(--muted)}
  .b.ok{background:rgba(63,185,80,.16);color:var(--ok)}
  .b.bad{background:rgba(248,81,73,.16);color:var(--bad)}
  .clue{display:block;width:100%;background:#0f1115;color:var(--ink);
        border:1px solid var(--line);border-radius:7px;padding:8px;margin:6px 0;
        font-size:13px}
  .wc{color:var(--muted);font-size:11px}
  .wc.over{color:var(--bad)}
  .err{color:var(--bad);font-size:12px;white-space:pre-wrap;
       font-family:ui-monospace,Menlo,monospace}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}

  /* The gallery is a grid, not a flex row: tiles now carry clues and three
     actions, so they need a column each rather than whatever width is left. */
  #gallery{display:grid;gap:16px;
           grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px;display:flex;flex-direction:column}
  .tile .cap{color:var(--muted);font-size:11px;margin-bottom:6px;
             text-transform:uppercase;letter-spacing:.06em}
  .tile img{border:1px solid var(--line);border-radius:8px}
  .clues{margin:4px 0 10px;padding-left:18px;color:var(--ink);font-size:12px}
  .clues li{margin:4px 0}
  .state{font-size:12px;margin:2px 0 8px}
  .ok-txt{color:var(--ok)}
  .bad-txt{color:var(--bad)}
  .actions{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
  .actions button{padding:6px 12px;font-size:12px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
              display:flex;align-items:center;justify-content:center;padding:28px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:18px;width:min(1100px,100%);max-height:92vh;overflow:auto;
         position:relative}
  .modal h2{font-size:15px;margin:0 0 12px;padding-right:40px}
  .modal .x{position:absolute;top:12px;right:12px;padding:4px 10px}
  .modal-body{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
  .modal-img{flex:1 1 320px;min-width:260px}
  .modal-edit{flex:1 1 380px;min-width:280px;display:flex;flex-direction:column}
  .modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;
              margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>Chonky</h1>
  <span class="geo" id="geo">loading geometry…</span>
</header>

<main>
  <p class="sub">Say how many images you want. The tool picks locations that
  aren't already used, writes each prompt to the manual's rules, renders it
  once and measures Chonky. You review what comes back.</p>
  <div class="row">
    <label class="geo">How many
      <input id="count" type="number" value="1" min="1" max="12" style="width:64px">
    </label>
    <label class="geo">Difficulty
      <input id="difficulty" type="number" value="1" min="1" max="6" style="width:64px">
    </label>
    <label class="geo">ViewFrame share
      <input id="pct" type="number" value="70" min="0" max="100" style="width:64px">%
    </label>
    <button id="generate">Generate</button>
  </div>
  <div class="row">
    <label class="geo" style="flex:1">Specific cities (optional, one per line — blank means the tool chooses)
      <textarea id="cities" style="height:60px" placeholder="Prague, Czech Republic"></textarea>
    </label>
  </div>

  <div id="cards"></div>

  <h2 style="font-size:14px;margin:26px 0 0">Everything rendered so far</h2>
  <p class="sub" id="gallery-sub">loading…</p>
  <div id="gallery"></div>
</main>

<script>
let VF = [424, 213, 1624, 2346];
const IMG = [2048, 2560];

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

api('api/health').then(h => {
  document.getElementById('geo').textContent =
    `${h.image} · ViewFrame ${h.viewframe} · Chonky ${h.chonky_height_px} px`;
  VF = h.viewframe_box;
});

loadGallery();

const generateBtn = document.getElementById('generate');

generateBtn.onclick = async () => {
  generateBtn.disabled = true;
  const cities = document.getElementById('cities').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const body = {
    count: +document.getElementById('count').value,
    difficulty: +document.getElementById('difficulty').value,
    viewframe_pct: +document.getElementById('pct').value,
    cities,
  };
  const res = await api('api/generate', body);
  const host = document.getElementById('cards');
  res.jobs.forEach(j => host.prepend(card(j, body.difficulty)));
  generateBtn.disabled = false;
};

// The page must never open empty: renders cost credits and outlive the
// process that made them, so what is on disk is what the page opens on.
async function loadGallery() {
  const {renders} = await api('api/renders');
  const host = document.getElementById('gallery');
  const sub = document.getElementById('gallery-sub');
  host.innerHTML = '';
  if (!renders.length) { sub.textContent = 'Nothing rendered yet.'; return; }
  const passing = renders.filter(r => r.measurement && r.measurement.ok).length;
  sub.textContent = `${renders.length} render${renders.length === 1 ? '' : 's'} · ${passing} passing`;
  renders.forEach(r => host.appendChild(tile(r)));
}

function tile(r) {
  const m = r.measurement;
  const t = el('div', 'tile');
  t.appendChild(el('div', 'cap', r.location || r.image_id));

  const a = document.createElement('a');
  a.href = `api/frame/${r.image_id}`;
  a.target = '_blank';
  const im = new Image();
  im.src = `api/frame/${r.image_id}`;
  im.style.cssText = 'width:100%;display:block';
  a.appendChild(im);
  t.appendChild(a);

  const badge = el('span', 'b ' + (m ? (m.ok ? 'ok' : 'bad') : ''),
    m ? `${m.height_px} px · ${m.size} · ${m.zone}` : 'not measured');
  badge.style.cssText = 'margin:8px 0;display:inline-block';
  t.appendChild(badge);

  // The clues are the level. Judging a render without them means judging half
  // of what was made.
  if (r.clues && r.clues.length) {
    const cl = el('ol', 'clues');
    r.clues.forEach(c => cl.appendChild(el('li', null, c)));
    t.appendChild(cl);
  }

  if (r.approved) t.appendChild(el('div', 'state ok-txt', '✓ approved — on Drive'));
  if (r.rejected) t.appendChild(el('div', 'state bad-txt',
    '✕ rejected' + (r.reject_reason ? ` — ${r.reject_reason}` : '')));

  const actions = el('div', 'actions');
  const approve = el('button', null, 'Approve');
  const rejectBtn = el('button', 'ghost', 'Reject');
  const edit = el('button', 'ghost', 'Edit');
  const note = el('span', 'wc', '');
  actions.append(approve, rejectBtn, edit, note);
  t.appendChild(actions);

  // Approve is the only write path: Drive plus the sheet row.
  approve.disabled = !(m && m.ok) || r.approved;
  if (m && !m.ok) approve.title = 'This render failed its size or zone check.';

  approve.onclick = async () => {
    approve.disabled = true;
    note.textContent = 'saving to Drive…';
    const res = await api('api/approve', {image_id: r.image_id});
    if (res.error) { note.textContent = res.error; approve.disabled = false; return; }
    note.textContent = 'saved';
    loadGallery();
  };

  rejectBtn.onclick = async () => {
    const reason = window.prompt('Why is this one rejected?', '') ?? null;
    if (reason === null) return;
    await api('api/reject', {image_id: r.image_id, reason});
    loadGallery();
  };

  edit.onclick = () => openEditor(r);
  return t;
}

// The prompt beside the picture it produced, so an edit is made looking at
// what the last one actually did.
function openEditor(r) {
  const back = el('div', 'modal-back');
  const box = el('div', 'modal');

  const close = el('button', 'ghost x', '✕');
  close.title = 'Close';
  box.appendChild(close);

  box.appendChild(el('h2', null, r.location || r.image_id));

  const split = el('div', 'modal-body');
  const left = el('div', 'modal-img');
  const im = new Image();
  im.src = `api/frame/${r.image_id}`;
  im.style.cssText = 'width:100%;display:block;border-radius:8px';
  left.appendChild(im);
  split.appendChild(left);

  const right = el('div', 'modal-edit');
  right.appendChild(el('div', 'cap', 'Prompt'));
  const ta = document.createElement('textarea');
  ta.value = r.prompt || '';
  ta.style.cssText = 'width:100%;height:100%;min-height:340px';
  right.appendChild(ta);
  split.appendChild(right);
  box.appendChild(split);

  const foot = el('div', 'modal-foot');
  const note = el('span', 'wc', '');
  const regen = el('button', null, 'Regenerate');
  foot.append(note, regen);
  box.appendChild(foot);

  const shut = () => back.remove();
  close.onclick = shut;
  back.onclick = e => { if (e.target === back) shut(); };

  regen.onclick = async () => {
    regen.disabled = true;
    note.textContent = 'rendering…';
    const res = await api('api/regenerate', {image_id: r.image_id, prompt: ta.value});
    if (res.error) { note.textContent = res.error; regen.disabled = false; return; }
    shut();
    const host = document.getElementById('cards');
    host.prepend(card({job_id: res.job_id, image_id: res.image_id,
                       target_zone: r.target_zone}, r.difficulty));
  };

  back.appendChild(box);
  document.body.appendChild(back);
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function card(job, difficulty) {
  const row = {
    id: job.image_id,
    difficulty,
    target_zone: job.target_zone,
    location: 'choosing a location…',
  };
  const c = el('div', 'card');
  const head = el('h2', null, `Difficulty ${difficulty} — writing the prompt…`);
  c.appendChild(head);
  c.appendChild(el('div', 'sub', `Chonky zone: ${job.target_zone}`));

  const bar = el('div', 'row');
  const status = el('span', 'wc', 'writing the prompt…');
  bar.append(status);
  c.appendChild(bar);

  const body = el('div');
  c.appendChild(body);

  poll(job.job_id, row, body, status, head);
  return c;
}

async function poll(jobId, row, body, status, head) {
  const j = await api(`api/jobs/${jobId}`);
  if (j.state === 'drafting') {
    status.textContent = 'writing the prompt…';
    return setTimeout(() => poll(jobId, row, body, status, head), 2000);
  }
  if (j.state === 'running') {
    status.textContent = 'rendering…';
    return setTimeout(() => poll(jobId, row, body, status, head), 2000);
  }
  if (j.state === 'failed') {
    status.textContent = 'failed';
    body.innerHTML = '';
    body.appendChild(el('div', 'err', j.error + '\n\n' + (j.trace || '')));
    return;
  }
  status.textContent = 'rendered';
  // The prompt and location were written by the tool, so they are only known
  // once the job is done. Fill them in from what it recorded.
  const side = (await api('api/renders')).renders
    .find(r => r.image_id === j.image_id) || {};
  if (side.location) {
    row.location = side.location;
    head.textContent = `Difficulty ${row.difficulty} — ${side.location}`;
  }
  row.prompt = side.prompt;
  row.clues = side.clues;
  render(row, j, body);
  loadGallery();
}

function render(row, job, body) {
  body.innerHTML = '';
  const m = job.measurement || {};
  // The render is not always the reference size, so the overlay, the drag
  // maths and the ViewFrame rectangle all work in THIS frame's coordinates.
  // Using the reference constants on a 1344x1680 render drew the ViewFrame
  // past the bottom of the picture and scaled every dragged box by 1.5.
  const FRAME = m.frame_size || IMG;
  const VFB = m.viewframe_box || VF;
  let box = m.box || [VFB[0] + 100, VFB[1] + 100, VFB[0] + 190, VFB[1] + 190];

  const imgs = el('div', 'imgs');

  // Full frame with a draggable measurement rectangle. The detector is good
  // but not infallible; one drag corrects it and the verdict recomputes.
  const left = el('div', 'pane');
  left.appendChild(el('div', 'cap', 'Full frame — drag the box onto Chonky'));
  const stage = el('div', 'stage');
  const im = new Image();
  im.src = `api/frame/${job.image_id}`;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${FRAME[0]} ${FRAME[1]}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const vfRect = mkRect(VFB[0], VFB[1], VFB[2] - VFB[0], VFB[3] - VFB[1], '#4c8dff', '6 10');
  const catRect = mkRect(box[0], box[1], box[2] - box[0], box[3] - box[1], '#f85149', null);
  svg.append(vfRect, catRect);
  stage.append(im, svg);
  left.appendChild(stage);
  left.appendChild(el('div', 'hint', 'Blue = ViewFrame. Red = Chonky. Drag inside the image to redraw.'));
  imgs.appendChild(left);

  const right = el('div', 'pane');
  right.appendChild(el('div', 'cap', 'ViewFrame — what the player opens on'));
  const vfim = new Image();
  vfim.src = `api/viewframe/${job.image_id}`;
  vfim.style.maxHeight = '620px';
  right.appendChild(vfim);
  imgs.appendChild(right);

  // The model sheet, beside the render. Size and zone are measured; likeness
  // is not and cannot be, so the one judgement only a person can make is the
  // one that was being made from memory. A plausible ginger cat passes every
  // automated check in this pipeline.
  const ref = el('div', 'pane');
  ref.appendChild(el('div', 'cap', 'Chonky — is the cat in the render THIS cat?'));
  const refim = new Image();
  refim.src = 'api/reference';
  refim.style.maxHeight = '260px';
  refim.alt = 'Chonky model sheet';
  ref.appendChild(refim);
  ref.appendChild(el('div', 'hint',
    'Body shape, markings and face come from here. An ordinary ginger cat is a failed render.'));
  imgs.appendChild(ref);

  body.appendChild(imgs);

  if (row.prompt) {
    const det = document.createElement('details');
    det.style.margin = '10px 0';
    const sum = document.createElement('summary');
    sum.textContent = 'The prompt the tool wrote';
    sum.style.cssText = 'color:var(--muted);font-size:12px;cursor:pointer';
    det.appendChild(sum);
    const pre = el('div', 'err');
    pre.style.color = 'var(--muted)';
    pre.textContent = row.prompt;
    det.appendChild(pre);
    body.appendChild(det);
  }

  const badges = el('div', 'badges');
  body.appendChild(badges);

  const clues = [0, 1, 2].map(i => {
    const wrap = el('div');
    const inp = el('input', 'clue');
    inp.placeholder = `Clue ${i + 1} — max 12 words, [bracket] the key nouns`;
    const wc = el('div', 'wc', '0 words');
    inp.oninput = () => {
      const n = inp.value.trim() ? inp.value.trim().split(/\s+/).length : 0;
      wc.textContent = `${n} words`;
      wc.className = 'wc' + (n > 12 ? ' over' : '');
    };
    wrap.append(inp, wc);
    body.appendChild(wrap);
    return inp;
  });

  const words = el('input', 'clue');
  words.placeholder = 'Three one-word features for the filename, comma separated (arch, calcada, clock)';
  body.appendChild(words);

  const actions = el('div', 'row');
  const approve = el('button', null, 'Approve → Drive + sheet');
  const out = el('span', 'wc', '');
  actions.append(approve, out);
  body.appendChild(actions);

  function paint(v) {
    badges.innerHTML = '';
    const sizeOk = v.size === 'ok';
    const zoneOk = v.zone === row.target_zone;
    badges.append(
      el('span', 'b ' + (sizeOk ? 'ok' : 'bad'), `${v.height_px} px — ${v.size}`),
      el('span', 'b ' + (zoneOk ? 'ok' : 'bad'), `${v.zone} (assigned ${row.target_zone})`),
      el('span', 'b', `x ${v.box[0]}–${v.box[2]}, y ${v.box[1]}–${v.box[3]}`)
    );
    // A colour-sourced box is a guess, not a measurement: it has put the
    // rectangle on a pedestrian under a sunlit arch. Say so, so the reviewer
    // drags the box instead of trusting the numbers beside it.
    if (v.detector === 'colour') {
      badges.append(el('span', 'b bad',
        'box from the colour fallback — check it and drag if wrong'));
    }
    approve.disabled = !(sizeOk && zoneOk);
    current = v;
  }
  let current = null;
  paint({...m, box});

  // drag to redraw
  let start = null;
  stage.onpointerdown = e => {
    const r = stage.getBoundingClientRect();
    start = [(e.clientX - r.left) / r.width * FRAME[0], (e.clientY - r.top) / r.height * FRAME[1]];
    stage.setPointerCapture(e.pointerId);
  };
  stage.onpointermove = e => {
    if (!start) return;
    const r = stage.getBoundingClientRect();
    const now = [(e.clientX - r.left) / r.width * FRAME[0], (e.clientY - r.top) / r.height * FRAME[1]];
    box = [Math.round(Math.min(start[0], now[0])), Math.round(Math.min(start[1], now[1])),
           Math.round(Math.max(start[0], now[0])), Math.round(Math.max(start[1], now[1]))];
    setRect(catRect, box);
  };
  stage.onpointerup = async () => {
    if (!start) return;
    start = null;
    paint(await api('api/measure', {box, image_id: job.image_id}));
  };

  approve.onclick = async () => {
    approve.disabled = true;
    out.textContent = 'delivering…';
    const res = await api('api/approve', {
      image_id: job.image_id, difficulty: row.difficulty,
      city: row.city, country: row.country,
      clue_words: words.value.split(',').map(s => s.trim()).filter(Boolean),
      measurement: current, clues: clues.map(c => c.value), prompt: row.prompt,
    });
    out.textContent = res.error ? ('✗ ' + res.error)
                                : `✓ ${res.filename} — ${res.kb} KB`;
    if (res.error) approve.disabled = false;
  };
}

function mkRect(x, y, w, h, colour, dash) {
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', x); r.setAttribute('y', y);
  r.setAttribute('width', w); r.setAttribute('height', h);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke', colour);
  r.setAttribute('stroke-width', 6);
  if (dash) r.setAttribute('stroke-dasharray', dash);
  return r;
}
function setRect(r, b) {
  r.setAttribute('x', b[0]); r.setAttribute('y', b[1]);
  r.setAttribute('width', b[2] - b[0]); r.setAttribute('height', b[3] - b[1]);
}
</script>
</body>
</html>
